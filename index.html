<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidLingo - مترجم الفيديو</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }
        header {
            text-align: center;
            padding: 20px 0 12px;
        }
        header h1 {
            font-size: 2em;
            color: #7c3aed;
            margin-bottom: 6px;
        }
        header p { color: #888; font-size: 0.95em; }

        /* Settings */
        .settings {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
            padding: 14px;
            background: #1a1a2e;
            border-radius: 12px;
        }
        .setting-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-group label { font-size: 0.9em; color: #aaa; }
        .setting-group select {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #252540;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 0.9em;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 14px 0;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-start { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; }
        .btn-start:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 4px 20px rgba(124,58,237,0.4); }
        .btn-stop { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; }
        .btn-stop:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 4px 20px rgba(220,38,38,0.4); }
        .btn-clear { background: #374151; color: #d1d5db; }
        .btn-clear:hover:not(:disabled) { background: #4b5563; }

        /* Status */
        .status-bar {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 0.95em;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-bar.idle { background: #1a1a2e; color: #666; }
        .status-bar.capturing { background: rgba(124,58,237,0.15); color: #a78bfa; }
        .status-bar.processing { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .status-bar.error { background: rgba(220,38,38,0.15); color: #f87171; }
        .status-bar.success { background: rgba(34,197,94,0.15); color: #4ade80; }
        .pulse {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .pulse.red { background: #ef4444; }
        .pulse.blue { background: #3b82f6; }
        .pulse.purple { background: #7c3aed; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Main Layout: Video + Translations side by side */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 14px;
        }
        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        /* Video Section */
        .video-section {
            background: #1a1a2e;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .video-section video {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background: #000;
            display: block;
        }
        .video-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 1.1em;
            background: #111;
        }
        .video-placeholder .icon { font-size: 3em; margin-bottom: 10px; }
        .rec-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .rec-badge.active { display: flex; }
        .rec-dot {
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        /* Translation Section */
        .translation-section {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }
        .translation-section h3 {
            color: #a78bfa;
            margin-bottom: 12px;
            font-size: 1em;
        }
        .results-container {
            flex: 1;
            max-height: 500px;
            overflow-y: auto;
            padding-left: 6px;
        }
        .results-container::-webkit-scrollbar { width: 5px; }
        .results-container::-webkit-scrollbar-track { background: #1a1a2e; border-radius: 3px; }
        .results-container::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 3px; }

        .result-card {
            background: #252540;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            border-right: 3px solid #7c3aed;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card .original {
            color: #9ca3af;
            font-size: 0.85em;
            margin-bottom: 4px;
            direction: ltr;
            text-align: left;
        }
        .result-card .translation {
            color: #e0e0e0;
            font-size: 1.05em;
            line-height: 1.6;
        }
        .no-results {
            text-align: center;
            padding: 40px 16px;
            color: #555;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .no-results .icon { font-size: 2.5em; margin-bottom: 8px; }

        /* Stats */
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 10px;
        }
        .stat { text-align: center; }
        .stat .value { font-size: 1.3em; font-weight: 700; color: #7c3aed; }
        .stat .label { font-size: 0.8em; color: #888; }

        /* Info box */
        .info-box {
            background: rgba(124,58,237,0.1);
            border: 1px solid rgba(124,58,237,0.3);
            border-radius: 10px;
            padding: 14px;
            margin: 12px 0;
            font-size: 0.9em;
            line-height: 1.7;
            color: #bbb;
        }
        .info-box strong { color: #a78bfa; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VidLingo</h1>
            <p>مترجم الفيديو بالذكاء الاصطناعي — Whisper large-v3-turbo</p>
        </header>

        <div class="info-box">
            <strong>كيف تستعمل:</strong> اضغط "التقاط التبويب" → اختر التبويب اللي فيه الفيديو → شوف الفيديو والترجمة مع بعض!
        </div>

        <div class="settings">
            <div class="setting-group">
                <label>لغة المصدر:</label>
                <select id="sourceLang">
                    <option value="auto">تلقائي</option>
                    <option value="en" selected>English</option>
                    <option value="ar">العربية</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="tr">Türkçe</option>
                    <option value="de">Deutsch</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="zh">中文</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ur">اردو</option>
                </select>
            </div>
            <div class="setting-group">
                <label>لغة الترجمة:</label>
                <select id="targetLang">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
            </div>
            <div class="setting-group">
                <label>مدة القطعة:</label>
                <select id="chunkDuration">
                    <option value="5">5 ثواني</option>
                    <option value="8" selected>8 ثواني</option>
                    <option value="10">10 ثواني</option>
                    <option value="15">15 ثانية</option>
                </select>
            </div>
        </div>

        <div class="controls">
            <button id="btnCapture" class="btn btn-start">🎙️ التقاط التبويب</button>
            <button id="btnStop" class="btn btn-stop" disabled>⏹️ إيقاف</button>
            <button id="btnClear" class="btn btn-clear">🗑️ مسح</button>
        </div>

        <div id="statusBar" class="status-bar idle">جاهز للاستخدام</div>

        <div class="stats" id="statsBar" style="display:none;">
            <div class="stat">
                <div class="value" id="statChunks">0</div>
                <div class="label">قطع</div>
            </div>
            <div class="stat">
                <div class="value" id="statSuccess">0</div>
                <div class="label">ناجحة</div>
            </div>
            <div class="stat">
                <div class="value" id="statFailed">0</div>
                <div class="label">فشل</div>
            </div>
        </div>

        <!-- Video + Translations side by side -->
        <div class="main-layout">
            <div class="video-section">
                <video id="videoPlayer" autoplay muted playsinline></video>
                <div id="videoPlaceholder" class="video-placeholder">
                    <div class="icon">🎬</div>
                    <p>الفيديو هيك بيظهر هنا</p>
                </div>
                <div id="recBadge" class="rec-badge">
                    <span class="rec-dot"></span> REC
                </div>
            </div>
            <div class="translation-section">
                <h3>📋 الترجمة</h3>
                <div id="resultsContainer" class="results-container">
                    <div class="no-results" id="noResults">
                        <div class="icon">🎙️</div>
                        <p>الترجمات بتظهر هنا</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://video-downloader-1-mthm.onrender.com';

        let mediaStream = null;
        let mediaRecorder = null;
        let audioContext = null;
        let processorNode = null;
        let sourceNode = null;
        let isCapturing = false;
        let abortController = null;
        let chunkTimer = null;
        let audioChunks = [];
        let stats = { chunks: 0, success: 0, failed: 0 };
        let cooldown = false;

        const btnCapture = document.getElementById('btnCapture');
        const btnStop = document.getElementById('btnStop');
        const btnClear = document.getElementById('btnClear');
        const statusBar = document.getElementById('statusBar');
        const resultsContainer = document.getElementById('resultsContainer');
        const noResults = document.getElementById('noResults');
        const statsBar = document.getElementById('statsBar');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoPlaceholder = document.getElementById('videoPlaceholder');
        const recBadge = document.getElementById('recBadge');
        const sourceLangSelect = document.getElementById('sourceLang');
        const targetLangSelect = document.getElementById('targetLang');
        const chunkDurationSelect = document.getElementById('chunkDuration');

        function setStatus(text, type = 'idle') {
            statusBar.className = 'status-bar ' + type;
            let p = '';
            if (type === 'capturing') p = '<span class="pulse purple"></span> ';
            if (type === 'processing') p = '<span class="pulse blue"></span> ';
            if (type === 'error') p = '<span class="pulse red"></span> ';
            statusBar.innerHTML = p + text;
        }

        function updateStats() {
            document.getElementById('statChunks').textContent = stats.chunks;
            document.getElementById('statSuccess').textContent = stats.success;
            document.getElementById('statFailed').textContent = stats.failed;
            if (stats.chunks > 0) statsBar.style.display = 'flex';
        }

        function addResult(original, translation) {
            noResults.style.display = 'none';
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = '<div class="original">' + escapeHtml(original) + '</div><div class="translation">' + escapeHtml(translation) + '</div>';
            resultsContainer.appendChild(card);
            resultsContainer.scrollTop = resultsContainer.scrollHeight;
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text; return d.innerHTML;
        }

        function readFileAsBase64(blob) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(r.result.split(',')[1]);
                r.onerror = reject;
                r.readAsDataURL(blob);
            });
        }

        async function processChunk(audioBlob) {
            if (!audioBlob || audioBlob.size < 500) return;
            stats.chunks++;
            updateStats();
            setStatus('جاري النسخ والترجمة...', 'processing');
            try {
                const base64Audio = await readFileAsBase64(audioBlob);
                abortController = new AbortController();
                const tid = setTimeout(() => abortController.abort(), 30000);
                const response = await fetch(API_URL + '/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audio_base64: base64Audio,
                        source_lang: sourceLangSelect.value,
                        target_lang: targetLangSelect.value,
                    }),
                    signal: abortController.signal,
                });
                clearTimeout(tid);
                const data = await response.json();
                if (data.error) {
                    setStatus(data.error, 'error');
                    setTimeout(() => { if (isCapturing) setStatus('جاري الالتقاط...', 'capturing'); }, 2000);
                    return;
                }
                if (data.translation && data.text) {
                    addResult(data.text, data.translation);
                    stats.success++;
                    setStatus('تمت الترجمة ✓', 'success');
                    setTimeout(() => { if (isCapturing) setStatus('جاري الالتقاط...', 'capturing'); }, 1500);
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    stats.failed++;
                    setStatus('خطأ في الاتصال', 'error');
                }
            }
            updateStats();
        }

        async function startCapture() {
            if (cooldown) { setStatus('انتظر قليلاً...', 'error'); return; }
            try {
                setStatus('اختر التبويب اللي فيه الفيديو...', 'processing');
                mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true,
                });
                const audioTracks = mediaStream.getAudioTracks();
                if (audioTracks.length === 0) {
                    setStatus('لم يتم التقاط صوت! شارك الصوت.', 'error');
                    stopCapture();
                    return;
                }

                isCapturing = true;
                btnCapture.disabled = true;
                btnStop.disabled = false;

                // === Show video ===
                videoPlayer.srcObject = mediaStream;
                videoPlayer.muted = false;
                videoPlaceholder.style.display = 'none';
                recBadge.classList.add('active');

                // === Audio processing for transcription ===
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                sourceNode = audioContext.createMediaStreamSource(new MediaStream(audioTracks));
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                audioChunks = [];

                processorNode.onaudioprocess = (e) => {
                    if (!isCapturing) return;
                    audioChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
                };

                sourceNode.connect(processorNode);
                processorNode.connect(audioContext.destination);

                const chunkSeconds = parseInt(chunkDurationSelect.value);
                clearInterval(chunkTimer);
                chunkTimer = setInterval(async () => {
                    if (!isCapturing || audioChunks.length === 0) return;
                    const wavBlob = createWavFromChunks(audioChunks);
                    audioChunks = [];
                    if (wavBlob && wavBlob.size > 500) processChunk(wavBlob);
                }, chunkSeconds * 1000);

                setStatus('جاري الالتقاط... شاهد الفيديو!', 'capturing');

                mediaStream.getVideoTracks()[0].addEventListener('ended', () => {
                    if (isCapturing) stopCapture();
                });

            } catch (err) {
                if (err.name === 'NotAllowedError') {
                    setStatus('تم إلغاء الاختيار', 'error');
                } else {
                    setStatus('خطأ: ' + err.message, 'error');
                }
                isCapturing = false;
                btnCapture.disabled = false;
            }
        }

        function createWavFromChunks(chunks) {
            if (chunks.length === 0) return null;
            const sampleRate = audioContext.sampleRate;
            const totalLength = chunks.reduce((a, c) => a + c.length, 0);
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const c of chunks) { merged.set(c, offset); offset += c.length; }
            const int16 = new Int16Array(merged.length);
            for (let i = 0; i < merged.length; i++) {
                const s = Math.max(-1, Math.min(1, merged[i]));
                int16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            const buf = new ArrayBuffer(44 + int16.length * 2);
            const v = new DataView(buf);
            const ws = (view, off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
            ws(v, 0, 'RIFF'); v.setUint32(4, 36 + int16.length * 2, true); ws(v, 8, 'WAVE');
            ws(v, 12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
            v.setUint16(22, 1, true); v.setUint32(24, sampleRate, true);
            v.setUint32(28, sampleRate * 2, true); v.setUint16(32, 2, true);
            v.setUint16(34, 16, true); ws(v, 36, 'data');
            v.setUint32(40, int16.length * 2, true);
            for (let i = 0; i < int16.length; i++) v.setInt16(44 + i * 2, int16[i], true);
            return new Blob([buf], { type: 'audio/wav' });
        }

        function stopCapture() {
            isCapturing = false;
            if (abortController) { abortController.abort(); abortController = null; }
            clearInterval(chunkTimer); chunkTimer = null;

            if (audioChunks.length > 0) {
                const wavBlob = createWavFromChunks(audioChunks);
                audioChunks = [];
                if (wavBlob) processChunk(wavBlob);
            }

            if (processorNode) { processorNode.disconnect(); processorNode = null; }
            if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
            if (audioContext) { audioContext.close().catch(() => {}); audioContext = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }

            videoPlayer.srcObject = null;
            videoPlaceholder.style.display = 'flex';
            recBadge.classList.remove('active');

            cooldown = true;
            btnCapture.disabled = true;
            btnStop.disabled = true;
            setStatus('انتظر 3 ثواني...', 'idle');
            setTimeout(() => { cooldown = false; btnCapture.disabled = false; setStatus('جاهز للاستخدام'); }, 3000);
        }

        function clearResults() {
            resultsContainer.innerHTML = '<div class="no-results" id="noResults"><div class="icon">🎙️</div><p>الترجمات بتظهر هنا</p></div>';
            stats = { chunks: 0, success: 0, failed: 0 };
            updateStats(); statsBar.style.display = 'none';
        }

        btnCapture.addEventListener('click', startCapture);
        btnStop.addEventListener('click', stopCapture);
        btnClear.addEventListener('click', clearResults);

        // Health check
        fetch(API_URL + '/health').then(r => r.json()).then(d => {
            setStatus(d.groq_ready ? 'جاهز — ' + d.model + ' ✓' : '⚠️ GROQ_API_KEY غير موجود', d.groq_ready ? 'success' : 'error');
        }).catch(() => setStatus('⚠️ لم يتم الاتصال بالسيرفر', 'error'));
    </script>
</body>
</html>
